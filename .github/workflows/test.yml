name: Testing

on:
  workflow_call:
  workflow_dispatch:

jobs:
  unittest:
    name: PyTest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        id: setup-python
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/cache@v4
        id: cache-env
        with:
          path: .venv
          key: ${{ runner.os }}-uv-${{ steps.setup-python.outputs.uv-version }}-env-${{ hashFiles('uv.lock') }}

      - name: Setup venv for testing & Install dependencies
        if: steps.cache-env.outputs.cache-hit != 'true'
        run: |
          uv venv
          uv sync --group test

      - name: Cache databases
        id: cache-databases
        uses: actions/cache@v4
        with:
          path: ~/.cache/refidxdb
          # Invalidate when a database URL (and thus its version) changes.
          key: ${{ runner.os }}-databases-${{ hashFiles('refidxdb/url/aria.py', 'refidxdb/url/refidx.py') }}

      - name: Download databases
        # Best-effort: on a network hiccup the cache-relative tests just skip.
        if: steps.cache-databases.outputs.cache-hit != 'true'
        continue-on-error: true
        run: uv run refidxdb db --download all

      - name: Test and coverage report with pytest
        # The real-download test is marked `network`; the cache-relative
        # assertions run when the download above populated the cache and skip
        # otherwise, so this run stays deterministic.
        run: uv run pytest -m "not network" --cov --cov-report xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            junit.xml
            htmlcov/
          retention-days: 7
