[project]
name = "refidxdb"
version = "0.4.0"
description = "Python interface for various refractive index databases"
readme = "README.md"
authors = [{ name = "Mirza Arnaut", email = "mirza.arnaut45@gmail.com" }]
license = { file = "LICENSE" }
requires-python = "<4.0,>=3.10"
dependencies = [
  "pydantic>=2.9.2",
  "rich>=13.8.1",
  "numpy>=1.26.4",
  "polars>=1.12.0",
  "streamlit>=1.40.1",
  "plotly>=5.24.1",
  "pyyaml>=6.0.2",
  "click>=8.1.7",
  "plotext>=5.2.8",
  "tqdm>=4.66.5",
]

[project.optional-dependencies]
build = ["python-semantic-release ~= 10.0"]

[dependency-groups]
test = ["pytest>=8.3.3", "pytest-cov>=5.0.0"]

[project.scripts]
refidxdb = "refidxdb.cli:cli"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.pytest.ini_options]
minversion = "8.0"
# addopts = "-ra -q"
log_cli = true
log_level = "INFO"
log_format = "%(asctime)s - %(name)-8s - %(levelname)s - %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
testpaths = ["tests"]
markers = [
  "network: test requires network access to download a database (deselect with '-m \"not network\"')",
]

[tool.coverage.run]
omit = ["*/app.py"]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build >= 0.8.0, <1.0.0"]
build-backend = "uv_build"

[tool.semantic_release]
version_variables = ["refidxdb/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
major_on_zero = false
build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[tool.semantic_release.branches.main]
match = "main"
